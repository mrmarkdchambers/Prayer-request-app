# Netlify picks these up automatically; no settings needed in the dashboard.
# Optional donation links (VITE_KOFI_URL, VITE_STRIPE_URL) can be set in Netlify under
# Project configuration → Environment variables.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Same public values as .env.production. Repeated here because settings in this file
  # take priority over Netlify's dashboard, where a blank variable of the same name
  # would otherwise override .env.production and switch accounts off.
  VITE_SUPABASE_URL = "https://vsvkvfwufcnyndtsfibg.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_U3qig2XIyLU7qpJq4AXhGQ__YMlLhkT"

# The app uses #/ routes, so no redirect rules are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be fresh so updates reach people.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
