# Netlify picks these up automatically; no settings needed in the dashboard.
# Set VITE_SUPABASE_ANON_KEY (and optionally the donation links) in Netlify under
# Site configuration → Environment variables.

[build]
  # The app lives at the repository root. This overrides the "Base directory"
  # set in the Netlify UI, which points to a "main" folder that does not exist.
  base = "/"
  # Install dependencies here too, because the automatic install step can be
  # skipped when the dashboard base directory is wrong.
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The project's public address (not a secret; every visitor's browser uses it).
  VITE_SUPABASE_URL = "https://vsvkvfwufcnyndtsfibg.supabase.co"

# The app uses #/ routes, so no redirect rules are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must always be fresh so updates reach people.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
